<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup | Expense Tracker</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-pprn3073KE6tl6mZzKJ7B2N1K5z9f9pD2tE6YbD8S6v5G5x0tx1+p3r8q1I74Gb7"
        crossorigin="anonymous">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f2f5;
      font-family: 'Poppins', sans-serif;
    }

    .signup-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }

    .signup-card {
      width: 100%;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      padding: 40px 30px;
      transition: 0.3s;
      text-align: center;
    }

    .signup-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
    }

    .signup-card h2 {
      font-weight: 700;
      margin-bottom: 25px;
      color: #343a40;
    }

    .form-control {
      border-radius: 10px;
      padding-left: 40px;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group i {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #6c757d;
    }

    .btn-signup {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      background: #198754;
      border: none;
      color: #fff;
      transition: 0.3s;
    }

    .btn-signup:hover {
      background: #157347;
    }

    .text-center a {
      text-decoration: none;
      color: #0d6efd;
      font-weight: 500;
    }

    .text-center a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="signup-wrapper">
  <div class="signup-card">
    <h2>Signup</h2>
    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <i class="fa fa-user"></i>
        <input type="text" name="username" class="form-control" placeholder="Username" required>
      </div>

      <div class="form-group">
        <i class="fa fa-lock"></i>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>

      <button type="submit" class="btn btn-signup mb-3">Signup</button>

      <p class="text-center">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </form>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+7qIXQ5s3QhpKk5cV+ZtT0WvL2nLg"
        crossorigin="anonymous"></script>
</body>
</html>
